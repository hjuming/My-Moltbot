name: Daily Sync and WEDO Monitor

on:
  schedule:
    - cron: '10 1 * * *' # 台灣時間 09:10
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - 'research/**'
      - '.github/workflows/**'

jobs:
  sync-and-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure scripts executable
        run: |
          mkdir -p scripts
          chmod +x ./scripts/*.sh || true

      - name: Run update_repos.sh
        env:
          READ_ONLY_PAT: ${{ secrets.READ_ONLY_PAT }}
        run: |
          ./scripts/update_repos.sh

      - name: Scrape Trending Repos
        id: scraper
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TODAY: ${{ env.TODAY }}
        run: |
          # 1. 執行搜尋腳本
          ./scripts/update_trending.sh
          
          # 2. 檢查是否有產出
          if [ -f "research/TRENDING_REPOS.md" ]; then
             echo "HAS_TRENDING=true" >> $GITHUB_OUTPUT
          else
             echo "HAS_TRENDING=false" >> $GITHUB_OUTPUT
          fi

      - name: Update LOG and Push
        if: always()
        env:
          MANAGEMENT_TOKEN: ${{ secrets.MANAGEMENT_TOKEN }}
          HAS_TRENDING: ${{ steps.scraper.outputs.HAS_TRENDING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TODAY: ${{ env.TODAY }}
        run: |
          # 重新定義 TODAY 確保 Shell 環境也有值
          TODAY=$(date +%Y-%m-%d)
          mkdir -p research
          
          # 紀錄 Log
          if [ "$HAS_TRENDING" = "true" ]; then
            REPORT_MSG="$TODAY Trending Repos: Updated"
          else
            REPORT_MSG="$TODAY Trending Repos: Skipped (Check API Key)"
          fi
          echo "$REPORT_MSG" >> research/LOG.md
          
          git config user.name "moltbot-action"
          git config user.email "moltbot-action@example.com"
          git add research/
          # 關鍵：[skip ci] 讓 GitHub 知道這是機器人更新，不要再次觸發 Action
          # 使用 git commit 前先檢查是否有變更
          git diff --staged --quiet || git commit -m "Automated Sync: $TODAY [skip ci]"
          git remote set-url origin https://${MANAGEMENT_TOKEN}@github.com/hjuming/My-Moltbot.git
          git push origin HEAD:main

          # Telegram 通知 (使用 Python 確保格式與換行正常)
          python3 - <<'PY'
          import os, json, urllib.request

          bot_token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          today = os.environ.get('TODAY')
          has_trending = os.environ.get('HAS_TRENDING')
          
          # 構建更新訊息
          if has_trending == "true":
              trend_msg = f"🔥 **Github 熱門專案**：已更新！\n🔗 [點我看報告](https://github.com/hjuming/My-Moltbot/blob/main/research/TRENDING_REPOS.md)"
          else:
              trend_msg = "💤 **Repo先知**：今天沒有發現新貨，或是缺了 TAVILY_API_KEY 喔。"

          message = f"""
          🐉 **老闆早安！小龍女來請安囉**
          📅 日期：{today}

          {trend_msg}

          _報告完畢！老闆今天也要加油喔！💪_
          """

          # 發送請求
          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "Markdown",
              "disable_web_page_preview": True
          }
          
          req = urllib.request.Request(url, 
              data=json.dumps(payload).encode('utf-8'), 
              headers={'Content-Type': 'application/json'})
          
          try:
              with urllib.request.urlopen(req) as response:
                  print("✅ Telegram 通知發送成功")
          except Exception as e:
              print(f"❌ Telegram 通知發送失敗: {e}")
          PY
