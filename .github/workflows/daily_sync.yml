name: Daily Sync and WEDO Monitor

on:
  schedule:
    - cron: '10 1 * * *' # 台灣時間 09:10
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - 'research/**'
      - '.github/workflows/**'

jobs:
  sync-and-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure scripts executable
        run: |
          mkdir -p scripts
          chmod +x ./scripts/*.sh || true

      - name: Run update_repos.sh
        env:
          READ_ONLY_PAT: ${{ secrets.READ_ONLY_PAT }}
        run: |
          ./scripts/update_repos.sh

      - name: Check WEDO marketing report
        id: wedo_check
        env:
          READ_ONLY_PAT: ${{ secrets.READ_ONLY_PAT }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          SINCE="${TODAY}T00:00:00Z"
          # 使用檔案紀錄 API 結果，避免環境變數過長導致報錯
          curl -sSL -H "Authorization: token $READ_ONLY_PAT" \
               "https://api.github.com/repos/hjuming/wedo-website/commits?since=${SINCE}" > wedo_resp.json
          
          python3 - <<'PY'
          import sys, json, os
          try:
              if os.path.exists('wedo_resp.json'):
                  with open('wedo_resp.json', 'r') as f:
                      j = json.load(f)
                  if isinstance(j, list) and len(j) > 0:
                      url = j[0].get('html_url', '')
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                          f.write(f"status=FOUND\nurl={url}\n")
                  else:
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                          f.write("status=NONE\n")
              else:
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write("status=NONE\n")
          except Exception:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("status=NONE\n")
          PY

      - name: Update LOG and Push
        env:
          MANAGEMENT_TOKEN: ${{ secrets.MANAGEMENT_TOKEN }}
          WEDO_STATUS: ${{ steps.wedo_check.outputs.status }}
          WEDO_URL: ${{ steps.wedo_check.outputs.url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          mkdir -p research
          if [ "$WEDO_STATUS" = "FOUND" ]; then
            REPORT_MSG="$TODAY WEDO report: $WEDO_URL"
          else
            REPORT_MSG="$TODAY WEDO report: 未生成"
          fi
          echo "$REPORT_MSG" >> research/LOG.md
          
          git config user.name "moltbot-action"
          git config user.email "moltbot-action@example.com"
          git add research/LOG.md
          # 關鍵：[skip ci] 讓 GitHub 知道這是機器人更新，不要再次觸發 Action
          git commit -m "Automated Sync: $TODAY [skip ci]" || exit 0
          git remote set-url origin https://${MANAGEMENT_TOKEN}@github.com/hjuming/My-Moltbot.git
          git push origin HEAD:main

          # Telegram 通知 (使用 Python 確保格式與換行正常)
          python3 - <<'PY'
          import os, json, urllib.request

          bot_token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          today = os.environ.get('TODAY')
          wedo_status = os.environ.get('WEDO_STATUS')
          wedo_url = os.environ.get('WEDO_URL')
          
          # 構建人性化的訊息
          if wedo_status == "FOUND":
              wedo_msg = f"✅ **WEDO 網站**：今日有更新！\n🔗 [查看詳細內容]({wedo_url})"
          else:
              wedo_msg = "💤 **WEDO 網站**：今日無動靜"

          message = f"""
          🦞 **早安！這是龍蝦機器人的每日匯報**
          📅 日期：{today}

          {wedo_msg}

          _報告完畢，祝您今天工作順心！_
          """

          # 發送請求
          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "Markdown",
              "disable_web_page_preview": True
          }
          
          req = urllib.request.Request(url, 
              data=json.dumps(payload).encode('utf-8'), 
              headers={'Content-Type': 'application/json'})
          
          try:
              with urllib.request.urlopen(req) as response:
                  print("✅ Telegram 通知發送成功")
          except Exception as e:
              print(f"❌ Telegram 通知發送失敗: {e}")
          PY
