name: Daily Sync and WEDO Monitor

on:
  schedule:
    - cron: '10 1 * * *' # 台灣時間 09:10
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - 'research/**'
      - '.github/workflows/**'

jobs:
  sync-and-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure scripts executable
        run: |
          mkdir -p scripts
          chmod +x ./scripts/*.sh || true

      - name: Run update_repos_enhanced.sh
        env:
          READ_ONLY_PAT: ${{ secrets.READ_ONLY_PAT }}
        run: |
          ./scripts/update_repos_enhanced.sh

      - name: Scrape Trending Repos
        id: scraper
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TODAY: ${{ env.TODAY }}
        run: |
          # 1. 執行搜尋腳本
          ./scripts/update_trending.sh
          
          # 2. 檢查是否有產出
          if [ -f "research/TRENDING_REPOS.md" ]; then
             echo "HAS_TRENDING=true" >> $GITHUB_OUTPUT
          else
             echo "HAS_TRENDING=false" >> $GITHUB_OUTPUT
          fi

      - name: Update LOG and Push
        if: always()
        env:
          MANAGEMENT_TOKEN: ${{ secrets.MANAGEMENT_TOKEN }}
          HAS_TRENDING: ${{ steps.scraper.outputs.HAS_TRENDING }}
          TODAY: ${{ env.TODAY }}
        run: |
          # 重新定義 TODAY 確保 Shell 環境也有值
          TODAY=$(date +%Y-%m-%d)
          mkdir -p research
          
          # 紀錄 Log
          if [ "$HAS_TRENDING" = "true" ]; then
            REPORT_MSG="$TODAY Trending Repos: Updated"
          else
            REPORT_MSG="$TODAY Trending Repos: Skipped (Check API Key)"
          fi
          echo "$REPORT_MSG" >> research/LOG.md
          
          git config user.name "moltbot-action"
          git config user.email "moltbot-action@example.com"
          git add research/
          # 關鍵：[skip ci] 讓 GitHub 知道這是機器人更新，不要再次觸發 Action
          # 使用 git commit 前先檢查是否有變更
          git diff --staged --quiet || git commit -m "Automated Sync: $TODAY [skip ci]"
          git remote set-url origin https://${MANAGEMENT_TOKEN}@github.com/hjuming/My-Moltbot.git
          git push origin HEAD:main
      
      - name: Set Date
        id: set_date
        run: echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
      
      - name: Send Email Notification
        if: always()
        env:
          TODAY: ${{ steps.set_date.outputs.today }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: GitHub 專案庫監控報告 - ${{ steps.set_date.outputs.today }}
          to: hjuming@gmail.com
          from: GitHub Actions <noreply@github.com>
          html_body: |
            <h2>🗂️ GitHub 專案庫監控報告</h2>
            <p><strong>日期</strong>：${{ steps.set_date.outputs.today }}</p>
            <p><strong>專案總數</strong>：46</p>
            
            <h3>📦 專案庫變動</h3>
            <p>查看完整報告：</p>
            <ul>
              <li><a href="https://github.com/hjuming/My-Moltbot/blob/main/research/GITHUB_REPOS.md">專案總覽</a></li>
              <li><a href="https://github.com/hjuming/My-Moltbot/blob/main/research/REPO_CHANGES.md">變動報告</a></li>
              <li><a href="https://github.com/hjuming/My-Moltbot/commits/main">最近 Commits</a></li>
            </ul>
            
            <p><em>此郵件由 GitHub Actions 自動發送</em></p>
