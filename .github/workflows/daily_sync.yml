name: Daily Sync and WEDO Monitor

on:
  schedule:
    - cron: '10 1 * * *' # 台灣時間 09:10
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - 'research/**'
      - '.github/workflows/**'

jobs:
  sync-and-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure scripts executable
        run: |
          mkdir -p scripts
          chmod +x ./scripts/*.sh || true

      - name: Run update_repos.sh
        env:
          READ_ONLY_PAT: ${{ secrets.READ_ONLY_PAT }}
        run: |
          ./scripts/update_repos.sh

      - name: Check WEDO marketing report and Website Status
        id: wedo_check
        env:
          READ_ONLY_PAT: ${{ secrets.READ_ONLY_PAT }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          SINCE="${TODAY}T00:00:00Z"
          
          # 1. 檢查 GitHub Commit
          curl -sSL -H "Authorization: token $READ_ONLY_PAT" \
               "https://api.github.com/repos/hjuming/wedo-website/commits?since=${SINCE}" > wedo_resp.json
          
          # 2. 檢查網站死活 (Ping)
          WEDO_SITE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.wedopr.com/ || echo "ERR")
          echo "WEDO_SITE_STATUS=$WEDO_SITE_STATUS" >> $GITHUB_OUTPUT

          python3 - <<'PY'
          import sys, json, os
          try:
              if os.path.exists('wedo_resp.json'):
                  with open('wedo_resp.json', 'r') as f:
                      j = json.load(f)
                  if isinstance(j, list) and len(j) > 0:
                      url = j[0].get('html_url', '')
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                          f.write(f"status=FOUND\nurl={url}\n")
                  else:
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                          f.write("status=NONE\n")
              else:
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write("status=NONE\n")
          except Exception:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("status=NONE\n")
          PY

      - name: Update LOG and Push
        if: always()
        env:
          MANAGEMENT_TOKEN: ${{ secrets.MANAGEMENT_TOKEN }}
          WEDO_STATUS: ${{ steps.wedo_check.outputs.status }}
          WEDO_URL: ${{ steps.wedo_check.outputs.url }}
          WEDO_SITE_CODE: ${{ steps.wedo_check.outputs.WEDO_SITE_STATUS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TODAY: ${{ env.TODAY }}
        run: |
          # 重新定義 TODAY 確保 Shell 環境也有值
          TODAY=$(date +%Y-%m-%d)
          echo "TODAY=$TODAY" >> $GITHUB_ENV
          mkdir -p research
          
          # 紀錄 Log
          if [ "$WEDO_STATUS" = "FOUND" ]; then
            REPORT_MSG="$TODAY WEDO report: $WEDO_URL"
          else
            REPORT_MSG="$TODAY WEDO report: 未生成"
          fi
          echo "$REPORT_MSG | Site Status: $WEDO_SITE_CODE" >> research/LOG.md
          
          git config user.name "moltbot-action"
          git config user.email "moltbot-action@example.com"
          git add research/LOG.md
          # 關鍵：[skip ci] 讓 GitHub 知道這是機器人更新，不要再次觸發 Action
          git commit -m "Automated Sync: $TODAY [skip ci]" || exit 0
          git remote set-url origin https://${MANAGEMENT_TOKEN}@github.com/hjuming/My-Moltbot.git
          git push origin HEAD:main

          # Telegram 通知 (使用 Python 確保格式與換行正常)
          python3 - <<'PY'
          import os, json, urllib.request

          bot_token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          today = os.environ.get('TODAY')
          wedo_status = os.environ.get('WEDO_STATUS')
          wedo_url = os.environ.get('WEDO_URL')
          site_code = os.environ.get('WEDO_SITE_CODE')
          
          # 構建更新訊息
          if wedo_status == "FOUND":
              wedo_msg = f"✨ **WEDO 更新**：發現新進度！\n🔗 [查看 Commit]({wedo_url})"
          else:
              wedo_msg = "💤 **WEDO 更新**：今日靜悄悄，無動靜"

          # 構建網站健康訊息
          if site_code == "200":
              health_msg = "✅ **網站監控**：https://www.wedopr.com/ 運作正常 (200 OK)"
          else:
              health_msg = f"⚠️ **網站監控**：https://www.wedopr.com/ 異常！狀態碼：{site_code}"

          message = f"""
          🐉 **老闆早安！小龍女來請安囉**
          📅 日期：{today}

          {wedo_msg}
          {health_msg}

          _報告完畢！老闆今天也要加油喔！💪_
          """

          # 發送請求
          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "Markdown",
              "disable_web_page_preview": True
          }
          
          req = urllib.request.Request(url, 
              data=json.dumps(payload).encode('utf-8'), 
              headers={'Content-Type': 'application/json'})
          
          try:
              with urllib.request.urlopen(req) as response:
                  print("✅ Telegram 通知發送成功")
          except Exception as e:
              print(f"❌ Telegram 通知發送失敗: {e}")
          PY
